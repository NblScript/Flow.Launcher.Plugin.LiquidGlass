name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish as a GitHub release (e.g. v1.0.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Flow.Launcher.Plugin.LiquidGlass.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          $pkg = "LiquidGlass"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item out/Flow.Launcher.Plugin.LiquidGlass.dll, out/plugin.json $pkg
          Copy-Item -Recurse out/Images $pkg
          Compress-Archive -Path "$pkg/*" -DestinationPath "Flow.Launcher.Plugin.LiquidGlass.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Flow.Launcher.Plugin.LiquidGlass
          path: Flow.Launcher.Plugin.LiquidGlass.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: Flow.Launcher.Plugin.LiquidGlass.zip
